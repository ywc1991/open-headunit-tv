name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble github debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The wrapper and AGP 8.13 require JDK 17+; android-ci.yml uses 21, so match it.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # Without these the native aasdk build (app/src/main/cpp) fails: the NDK and CMake
      # versions are pinned in app/build.gradle.kts and are not preinstalled on the runner.
      # Retried because sdkmanager downloads occasionally arrive corrupt.
      - name: Install pinned NDK and CMake
        run: |
          for attempt in 1 2 3; do
            sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
              "ndk;29.0.14206865" "cmake;3.22.1" && exit 0
            echo "sdkmanager attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "sdkmanager failed after 3 attempts" >&2
          exit 1

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: open-headunit-github-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
